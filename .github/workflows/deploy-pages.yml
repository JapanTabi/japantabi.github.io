name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 日本 06:00、台灣 05:00；GitHub 排程可能稍有延遲。
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      update_snow:
        description: "更新雪況後再發佈"
        type: boolean
        default: false

# Keep snow commits and deployments in order; bot commits do not trigger new runs.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || inputs.update_snow == true
        with:
          python-version: "3.12"
      - name: Update snow report
        if: github.event_name == 'schedule' || inputs.update_snow == true
        run: python scripts/update_snow.py
      - name: Commit updated report
        if: github.event_name == 'schedule' || inputs.update_snow == true
        run: |
          if [ -n "$(git status --porcelain public/data/snow_today.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/snow_today.json
            git commit -m "chore: update daily snow report"
            git push
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:admin
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check Pages configuration
        run: node scripts/check-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Diagnose failed Pages deployment
        if: failure() && steps.deployment.outcome == 'failure'
        continue-on-error: true
        run: node scripts/check-pages.mjs deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
